<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
</head>
<body>
    <h1>Complete Your Payment</h1>
    <p>Total Amount to Pay: ₹<span id="totalAmount">{{ total_amount }}</span></p>

    <!-- Payment Method Selection -->
    <label for="paymentMethod">Choose Payment Method:</label>
    <select id="paymentMethod">
        <option value="Credit Card">Credit Card</option>
        <option value="Debit Card">Debit Card</option>
    </select>
    

    <button id="payBtn">Pay Now</button>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const transactionId = "{{ transaction_id|default('0') }}";
            const totalAmount = parseFloat("{{ total_amount|default(0) }}") || 0;

            console.log("🔍 Loaded Payment Page - Transaction ID:", transactionId, "Total Amount:", totalAmount);

            if (!transactionId || transactionId === "undefined" || totalAmount <= 0) {
                alert("Invalid payment details. Please try again.");
                window.location.href = "/checkout";
                return;
            }

            document.getElementById('totalAmount').textContent = totalAmount.toFixed(2);

            document.getElementById('payBtn').onclick = async function () {
                const payBtn = this;
                payBtn.disabled = true;
                payBtn.textContent = "Processing...";

                const selectedPaymentMethod = document.getElementById("paymentMethod").value;

                try {
                    const res = await fetch('/create_order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            transaction_id: transactionId, 
                            total_amount: totalAmount,
                            payment_method: selectedPaymentMethod
                        })
                    });

                    const order = await res.json();
                    if (!res.ok) throw new Error(order.error || 'Failed to create order');

                    const options = {
                        "key": "rzp_test_3UulXQvQM07Hh2",
                        "amount": order.order.amount,
                        "currency": order.order.currency,
                        "order_id": order.order.id,
                        "name": "My Store",
                        "description": "Order Payment",
                        "image": "https://example.com/logo.png",
                        "theme": { "color": "#3399cc" },
                        "prefill": { 
                            "email": "customer@example.com",
                            "contact": "9876543210"
                        },
                        "handler": async function (response) {
                            try {
                                const verifyRes = await fetch('/payment_verification', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ 
                                        ...response, 
                                        transaction_id: transactionId,
                                        payment_method: selectedPaymentMethod
                                    })
                                });

                                const verifyData = await verifyRes.json();
                                if (verifyData.status === 'success') {
                                    alert("Payment Successful!");
                                    window.location.href = '/home';
                                } else {
                                    alert('Payment verification failed.');
                                }
                            } catch (error) {
                                console.error('Verification error:', error);
                                alert('Error verifying payment.');
                            }
                        }
                    };

                    const rzp = new Razorpay(options);
                    rzp.on('payment.failed', function (response) {
                        console.error("Payment failed:", response.error);
                        alert(`Payment failed: ${response.error.code}\nReason: ${response.error.reason}`);
                        payBtn.disabled = false;
                        payBtn.textContent = "Pay Now";
                    });

                    rzp.open();
                } catch (error) {
                    console.error('Payment error:', error);
                    alert('Payment failed: ' + error.message);
                    payBtn.disabled = false;
                    payBtn.textContent = "Pay Now";
                }
            };
        });
    </script>
</body>
</html>
