<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign In - SuperMarket Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/manager/css/style.css') }}"
    />
  </head>
  <body>
    <div class="d-flex align-items-center justify-content-center vh-100">
      <div class="form-container">
        <div class="mb-4">
          <h3 class="text-dark fw-bold">Smart SuperMarket</h3>
          <p class="text-muted">Sign in to continue</p>
        </div>
        <form id="loginForm">
          <div class="form-floating mb-3">
            <input
              type="text"
              class="form-control"
              name="textfield"
              id="textfield"
              placeholder="name@example.com or username"
              required
            />
            <label for="textfield">Username/Email</label>
          </div>
          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control"
              name="textfield2"
              id="textfield2"
              placeholder="Password"
              required
            />
            <label for="textfield2">Password</label>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe" />
              <label class="form-check-label" for="rememberMe"
                >Remember me</label
              >
            </div>
            <a href="/forgot-password">Forgot Password?</a>
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
        <p class="mt-3">
          Don't have an account? <a href="/signup">Sign Up</a>
        </p>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript to Handle JSON Login Request -->
    <script>
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
          e.preventDefault();
      
          const formData = {
              textfield: document.getElementById("textfield").value.trim(),
              textfield2: document.getElementById("textfield2").value
          };
      
          try {
              const response = await fetch("/login", {
                  method: "POST",
                  headers: {
                      "Content-Type": "application/json",
                  },
                  body: JSON.stringify(formData)
              });
      
              const result = await response.json();
              
              if (!response.ok) {
                  throw new Error(result.error || "Login failed");
              }
      
              if (result.success) {
                  window.location.href = result.redirect;
              } else {
                  alert(result.error || "Invalid credentials");
              }
          } catch (error) {
              console.error("Error:", error);
              alert(error.message || "An error occurred during login");
          }
      });
      </script>
  </body>
</html>
