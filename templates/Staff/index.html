<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container-fluid mt-4">
        <!-- Low Stock Alert -->
        <div id="low-stock-alert" class="alert alert-warning d-none text-center fw-bold" role="alert"></div>

        <div class="row">
            <!-- Left Section: Add / Update Product -->
            <div class="col-lg-8">
                <div class="card p-4 mb-4 shadow">
                    <h4 class="text-success text-center">Add / Update Product</h4>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input type="text" id="product-name" class="form-control" placeholder="Product Name">
                        </div>
                        <div class="col-md-6">
                            <select id="category" class="form-select">
                                <option value="Fruits">Fruits</option>
                                <option value="Vegetables">Vegetables</option>
                                <option value="Drinks">Drinks</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <input type="number" id="stock-amount" class="form-control" placeholder="Stock Amount">
                        </div>
                        <div class="col-md-4">
                            <input type="text" id="promotion" class="form-control" placeholder="Promotion (Optional)">
                        </div>
                        <div class="col-md-4">
                            <input type="number" id="price" class="form-control" placeholder="Price">
                        </div>
                        <div class="col-md-8">
                            <input type="file" id="product-image" class="form-control" accept="image/*" onchange="previewImage(event)">
                        </div>
                        <div class="col-md-4 text-center">
                            <img id="image-preview" src="#" alt="Product Image" class="img-thumbnail d-none preview-img">
                        </div>
                        <div class="col-12 text-center mt-3">
                            <button class="btn btn-success btn-lg shadow w-100" onclick="addOrUpdateProduct()">Add Product</button>
                        </div>
                    </div>
                </div>

                <!-- Product Table -->
                <div class="table-responsive">
                    <table class="table table-bordered text-center align-middle shadow">
                        <thead class="table-dark">
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Stock</th>
                                <th>Promotion</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="product-list">
                            <!-- Dynamic content -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right Section: Pending Tasks -->
            <div class="col-lg-4">
                <div class="card p-3 shadow">
                    <h4 class="text-warning text-center">Pending Tasks</h4>
                    <ul id="task-list" class="list-group">
                        <li class="list-group-item text-muted">No pending tasks</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
