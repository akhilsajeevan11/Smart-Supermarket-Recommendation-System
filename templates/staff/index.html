<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff DashBoard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='staff/css/staff.css') }}"
    />
    <style>
      .notification-dialog {
        position: absolute;
        top: 60px;
        right: 20px;
        width: 300px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        display: none;
        z-index: 1000;
      }
      .notification-dialog .list-group-item {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <script>
      // Set staff_id from Flask session
      window.staffId = "{{ staff_id }}";
    </script>
    <!-- Header with Notification Center -->
    <nav class="navbar navbar-expand-lg navbar-dark px-3">
      <a class="navbar-brand fw-bold" href="#">Staff DashBoard</a>
      <div class="ms-auto position-relative">
        <button class="btn btn-warning" onclick="toggleNotifications()">
          Notifications
          <span id="notification-badge" class="badge bg-danger d-none">0</span>
        </button>
        <!-- Notification Dialog -->
        <div id="notification-dialog" class="notification-dialog p-3">
          <h6 class="text-center fw-bold">Notifications</h6>
          <ul id="notification-list" class="list-group list-group-flush">
            <li class="list-group-item text-muted">No notifications</li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container-fluid mt-4">
      <!-- Low Stock Alert -->
      <div
        id="low-stock-alert"
        class="alert alert-warning d-none text-center fw-bold"
        role="alert"
      ></div>

      <!-- Add / Update Product Section -->
      <div class="card card-custom p-4 mb-4" style="height: 450px">
        <h4 class="text-center mb-3">Add / Update Product</h4>
        <div class="row g-3">
          <div class="col-md-6">
            <input
              type="text"
              id="product-name"
              class="form-control p-3"
              placeholder="Product Name"
            />
          </div>
          <div class="col-md-6">
            <select id="category" class="form-select p-3">
              <option value="Fruits">Frozen</option>
              <option value="Vegetables">Bakery</option>
              <option value="Drinks">Dairy & Eggs</option>
              <option value="Drinks">Beverages</option>
            </select>
          </div>
          <div class="col-md-4">
            <input
              type="number"
              id="stock-amount"
              class="form-control p-3"
              placeholder="Stock Amount"
            />
          </div>
          <div class="col-md-4">
            <input
              type="text"
              id="promotion"
              class="form-control p-3"
              placeholder="Promotion (Optional)"
            />
          </div>
          <div class="col-md-4">
            <input
              type="number"
              id="price"
              class="form-control p-3"
              placeholder="Price"
            />
          </div>
          <div class="col-md-8">
            <input
              type="file"
              id="product-image"
              class="form-control p-3"
              accept="image/*"
              onchange="previewImage(event)"
            />
          </div>
          <div class="col-md-4 text-center">
            <img
              id="image-preview"
              src="#"
              alt="Product Image"
              class="img-thumbnail d-none preview-img"
            />
          </div>
          <div class="col-12 text-center mt-3">
            <button
              class="btn btn-custom btn-lg shadow w-100"
              onclick="addOrUpdateProduct()"
            >
              Add Product
            </button>
          </div>
        </div>
      </div>

      <!-- Full Width Product Table -->
      <div class="card card-custom p-3">
        <div class="table-responsive">
          <table class="table table-striped text-center align-middle">
            <thead>
              <tr>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Stock</th>
                <th>Promotion</th>
                <th>Price</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="product-list">
              <!-- Dynamic content -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='staff/js/staff.js') }}"></script>
  </body>
</html>
