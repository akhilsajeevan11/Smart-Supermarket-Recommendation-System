<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Sign Up - SuperMarket Hub</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/Smart-Supermarket-Recommendation-System/static/css/manager/css/style.css">
  </head>
<body>
    <div class="d-flex align-items-center justify-content-center vh-100">
        <div class="form-container">
            <div class="mb-4 text-center">
                <h3 class="text-dark fw-bold">Smart SuperMarket</h3>
                <p class="text-muted">Create your account</p>
            </div>
            <form id="registrationForm">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" placeholder="JohnDoe" required />
                    <label for="username">Username</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
                    <label for="email">Email Address</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="tel" class="form-control" id="number" placeholder="9999999999" pattern="[0-9]{10}" required />
                    <label for="number">Phone Number</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" minlength="10" required />
                    <label for="password">Password</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>
            <p class="mt-3">Already have an account? <a href="/login">Sign In</a></p>
            <p id="responseMessage" class="mt-3 text-center text-danger"></p>
        </div>
    </div>

    <!-- JavaScript to Handle Form Submission -->
    <script>
        document.getElementById("registrationForm").addEventListener("submit", async function (event) {
            event.preventDefault(); // Prevent default form submission

            const formData = {
                username: document.getElementById("username").value.trim(),
                email: document.getElementById("email").value.trim(),
                number: document.getElementById("number").value.trim(),
                password: document.getElementById("password").value.trim()
            };

            console.log("Sending data:", formData); // Log the data being sent

            try {
                const response = await fetch("/signup", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formData)
                });

                console.log("Response status:", response.status); // Log response status
                const result = await response.json();
                console.log("Server Response:", result); // Log JSON response

                document.getElementById("responseMessage").innerText = result.message;

                if (response.ok) {
                    document.getElementById("registrationForm").reset(); // Reset form on success
                    setTimeout(() => {
                        window.location.href = "/"; // Redirect after successful signup
                    }, 2000);
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("responseMessage").innerText = "Registration failed! Please try again.";
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
