<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Supermarket System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
    <link rel="stylesheet" href="/static/admin/css/style.css" />
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css"
  />
  </head>
  <body>
    <div class="d-flex">
      <div class="sidebar" id="sidebar">
        <h3>Admin Panel</h3>
        <a href="#" onclick="showSection('dashboard')">Dashboard</a>
        <a href="#" onclick="showSection('user-management')">User Management</a>
        <a href="/logout" class="btn btn-danger mt-4 w-100">Logout</a>
      </div>

      <div class="content flex-grow-1">
        <nav class="d-md-none">
          <button class="btn btn-outline-secondary" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
          </button>
        </nav>
        <!-- Dashboard chartjs -->
        <!-- Dashboard Section -->
        <div id="dashboard" class="p-4 bg-gray-100 rounded-2xl shadow-xl">
          <h2 class="fw-bold text-center">Sales Analytics</h2>
          <div class="chart-container" style="position: relative; height:50vh; width:100%;">
              <canvas id="salesChart"></canvas>
          </div>
        </div>


        <!-- user managment -->

        <div id="user-management" style="display: none">
          <!-- Add New User Form -->
          <div class="card-modern p-5 shadow mx-auto" style="max-width: 1000px;">
            <h3 class="mb-4 fw-bold text-center">Add New User</h3>
            <form id="userForm">
              <div class="form-group mb-4">
                <label class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control-modern"
                  id="username"
                  placeholder="Enter username"
                  required
                />
              </div>
              <div class="form-group mb-4">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control-modern"
                  id="email"
                  placeholder="Enter email"
                  required
                />
              </div>
              <div class="form-group mb-4">
                <label class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control-modern"
                  id="password"
                  placeholder="Enter password"
                  required
                />
              </div>
              <div class="form-group mb-4">
                <label class="form-label">Role</label>
                <select class="form-control-modern" id="role" required>
                  <option value="Manager">Manager</option>
                  <option value="Staff">Staff</option>
                  <!-- <option value="Customer">Customer</option> -->
                </select>
              </div>
              <button type="submit" class="btn-modern w-100">
                Create User
              </button>
              <div id="message" class="mt-3 text-center"></div>
            </form>
          </div>

          <!-- User List Section -->
          <div class="card-modern p-5 shadow mt-4 mx-auto" style="max-width: 1000px;">
            <h3 class="mb-4 fw-bold text-center">User List</h3>
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {% if users %}
                  {% for user in users %}
                    <tr>
                      <td>{{ user.username }}</td>
                      <td>{{ user.email }}</td>
                      <td>{{ user.role }}</td>
                      <td>
                        <button class="btn btn-danger btn-sm" onclick="deleteUser('{{ user.user_id }}')">
                          Delete
                        </button>
                      </td>
                    </tr>
                  {% endfor %}
                {% else %}
                  <tr>
                    <td colspan="4" class="text-center text-muted">No users found</td>
                  </tr>
                {% endif %}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <script src="/static/admin/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>

  </body>
</html>
