<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Supermarket System</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='admin/css/style.css') }}" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3>Admin Panel</h3>
            <a href="{{ url_for('admin_dashboard') }}" class="nav-link">Dashboard</a>
            <a href="{{ url_for('admin_users') }}" class="nav-link">User Management</a>
            <a href="{{ url_for('admin_sales') }}" class="nav-link">Sales Reports</a>
            <a href="{{ url_for('admin_notification') }}" class="nav-link">Notifications & Alerts</a>
            <a href="{{ url_for('admin_security') }}" class="nav-link">Data Security & Access Control</a>
        </div>
        
        <!-- Main Content -->
        <div class="content flex-grow-1" id="content">
            {% block content %}
            <!-- Default content -->
            <h2>Welcome to the Admin Panel</h2>
            <canvas id="salesChart" width="400" height="200"></canvas>
            {% endblock %}
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const ctx = document.getElementById("salesChart");
            if (ctx) {
                new Chart(ctx, {
                    type: "bar",
                    data: {
                        labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
                        datasets: [{
                            label: "Sales (in $1000s)",
                            data: [12, 19, 3, 5, 2, 3],
                            backgroundColor: "rgba(54, 162, 235, 0.5)"
                        }]
                    }
                });
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='admin/js/script.js') }}"></script>
</body>
</html>
