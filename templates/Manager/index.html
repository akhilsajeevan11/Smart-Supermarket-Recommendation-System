<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <h4>Manager Panel</h4>
        <a href="#dashboard" onclick="loadSection('dashboard')">Dashboard</a>
        <a href="#stock" onclick="loadSection('stock')">Stock Tracking</a>
    </div>

    <!-- Navbar with Hamburger -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
        <h2 class="navbar-title">Manager Dashboard</h2>
    </nav>

    <!-- Main Content -->
    <div class="content" id="section-content">
        <h2 class="text-center mb-4">Analytics Dashboard</h2>

        <div class="row">
            <div class="col-md-6">
                <div class="dashboard-card text-center">
                    <h5>Future Demanded Products</h5>
                    <canvas id="demandChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="dashboard-card text-center">
                    <h5>Current Sales Trend</h5>
                    <canvas id="salesChart"></canvas>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="dashboard-card text-center">
                    <h5>High Performing Products</h5>
                    <canvas id="topProductsChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="dashboard-card text-center">
                    <h5>Customer Preferences</h5>
                    <canvas id="customerChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./script.js"></script>

</body>
</html>
